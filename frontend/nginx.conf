# Serves the Vite build output. The app itself routes with URL hashes
# (window.location.hash — see App.jsx), so a real deep-link 404 against
# the server basically never happens in normal use, but try_files still
# falls back to index.html for any direct path request (e.g. someone
# bookmarks a bare path instead of a #/... hash) rather than a raw nginx
# 404 page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built asset filenames (content hash in the name),
    # so a cached asset is always either the exact right one or replaced
    # by a new filename on the next build — safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
